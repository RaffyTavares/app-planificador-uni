<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="EduGestor Pro: planificador universitario para organizar materias, horario, tareas, calificaciones, archivos y estudio.">
    <meta name="theme-color" content="#0b1215">
    <!-- App instalada (iOS/Android): pantalla completa, barra de estado translúcida sobre la cabecera -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduGestor">
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <title>EduGestor Pro · Planificador universitario</title>

    <!-- Aplica el tema guardado antes de pintar (preferencia de este dispositivo) -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            // Tema claro: barra de estado con texto oscuro (la translúcida siempre lo pone blanco)
            var claro = t === 'light' || (t !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
            if (claro) {
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f7f6');
                document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
    <a class="skip" href="#main">Saltar al contenido</a>
    <div class="aurora" aria-hidden="true"></div>

    <!-- Carga inicial -->
    <div class="boot" id="cargando" role="status">
        <span class="brand-mark lg"><img src="logo.jpeg" alt="" width="56" height="56"></span>
        <span class="spinner" aria-hidden="true"></span>
        <span class="sr-only">Cargando EduGestor…</span>
    </div>

    <!-- Iniciar sesión / crear cuenta -->
    <div class="auth" id="acceso" hidden></div>

    <div class="app" id="app" hidden>
        <!-- ============ BARRA LATERAL ============ -->
        <aside class="sidebar" aria-label="Navegación principal">
            <a class="brand" href="#/inicio" aria-label="EduGestor Pro, ir al inicio">
                <span class="brand-mark"><img src="logo.jpeg" alt="" width="40" height="40"></span>
                <span class="brand-text">
                    <strong>EduGestor <em>Pro</em></strong>
                    <small>Tu éxito académico</small>
                </span>
            </a>

            <a class="sem-chip" href="#/historial" title="Cambiar de semestre">
                <span data-i="cap"></span><span id="semChip"></span><span data-i="chevronDown"></span>
            </a>

            <nav class="nav" id="nav" aria-label="Secciones"></nav>

            <div class="side-widget" id="sideNext" aria-live="polite"></div>

            <div class="side-footer">
                <a class="user-card" href="#/ajustes" data-route="ajustes">
                    <span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
                    <span class="user-text"><strong id="userName"></strong><small id="userMeta"></small></span>
                    <span data-i="settings"></span>
                </a>
            </div>
        </aside>

        <!-- ============ COLUMNA PRINCIPAL ============ -->
        <div class="main-col">
            <header class="topbar">
                <a class="brand brand--compact" href="#/inicio" aria-label="EduGestor Pro, ir al inicio">
                    <span class="brand-mark"><img src="logo.jpeg" alt="" width="32" height="32"></span>
                </a>
                <p class="crumb" id="crumb"></p>

                <div class="topbar-actions">
                    <a class="mini-timer" id="miniTimer" href="#/enfoque" hidden aria-label="Temporizador de estudio">
                        <span data-i="timer"></span><span id="miniTimerText">25:00</span>
                    </a>
                    <button class="search-trigger" type="button" data-action="palette" aria-label="Buscar o ejecutar una acción">
                        <span data-i="search"></span>
                        <span class="search-trigger-text">Buscar o ejecutar…</span>
                        <kbd id="kbdHint">Ctrl K</kbd>
                    </button>
                    <button class="icon-btn theme-btn" type="button" data-action="theme" aria-label="Cambiar tema claro u oscuro">
                        <span class="theme-sun" data-i="sun"></span>
                        <span class="theme-moon" data-i="moon"></span>
                    </button>
                    <div class="menu-wrap">
                        <button class="btn btn-primary new-btn" id="newBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="newMenu">
                            <span data-i="plus"></span><span>Nuevo</span>
                        </button>
                        <div class="menu" id="newMenu" role="menu" hidden>
                            <button role="menuitem" type="button" data-action="new" data-type="tarea"><span data-i="tasks"></span>Tarea<kbd>N</kbd></button>
                            <button role="menuitem" type="button" data-action="new" data-type="examen"><span data-i="target"></span>Examen</button>
                            <button role="menuitem" type="button" data-action="new" data-type="clase"><span data-i="calendar"></span>Clase</button>
                            <button role="menuitem" type="button" data-action="new" data-type="materia"><span data-i="book"></span>Materia</button>
                            <button role="menuitem" type="button" data-action="new" data-type="nota"><span data-i="note"></span>Nota</button>
                            <button role="menuitem" type="button" data-action="new" data-type="evaluacion"><span data-i="award"></span>Calificación</button>
                        </div>
                    </div>
                </div>
            </header>

            <p class="offline-bar" id="offline" role="status" hidden><span data-i="wifiOff"></span>Sin conexión. Estás viendo la última información guardada; los cambios no se pueden guardar hasta que vuelvas a conectarte.</p>

            <main id="main" tabindex="-1">
                <section class="view" id="vista"></section>
            </main>
        </div>
    </div>

    <!-- ============ NAVEGACIÓN MÓVIL ============ -->
    <nav class="bottom-nav" aria-label="Navegación móvil">
        <a href="#/inicio" data-route="inicio"><span data-i="home"></span><span>Inicio</span></a>
        <a href="#/calendario" data-route="calendario"><span data-i="month"></span><span>Calendario</span></a>
        <button class="fab" type="button" data-action="sheet" data-sheet="new" aria-label="Crear nuevo"><span data-i="plus"></span></button>
        <a href="#/tareas" data-route="tareas"><span data-i="tasks"></span><span>Tareas</span></a>
        <button type="button" id="btnMas" data-action="sheet" data-sheet="more"><span data-i="grid"></span><span>Más</span></button>
    </nav>

    <!-- ============ DIÁLOGOS ============ -->
    <dialog id="formDialog" class="dialog" aria-labelledby="dlgTitle"></dialog>
    <dialog id="sheetDialog" class="dialog sheet" aria-label="Menú"></dialog>

    <dialog id="palette" class="palette" aria-label="Buscar y ejecutar">
        <div class="pal-search">
            <span data-i="search"></span>
            <input id="palInput" type="text" placeholder="Busca materias, tareas, notas, archivos o acciones…" autocomplete="off" spellcheck="false"
                   role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list">
            <kbd>Esc</kbd>
        </div>
        <ul id="palList" class="pal-list" role="listbox" aria-label="Resultados"></ul>
        <footer class="pal-foot">
            <span><kbd>↑</kbd><kbd>↓</kbd> moverse</span>
            <span><kbd>Enter</kbd> abrir</span>
            <span><kbd>Esc</kbd> cerrar</span>
        </footer>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
    <div class="chart-tip" id="chartTip" role="tooltip" hidden></div>
    <input type="file" id="importInput" accept="application/json,.json" hidden>

    <script type="module" src="js/main.js"></script>
</body>
</html>
